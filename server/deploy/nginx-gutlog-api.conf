# /etc/nginx/sites-available/gutlog-api  ->  ln -s into sites-enabled
# Separate server block on its own subdomain. Does not touch the existing Foundry server block.
server {
    listen 80;
    listen [::]:80;
    server_name gutlog-api.EXAMPLE.COM;   # <- your subdomain; certbot --nginx will add the 443 block

    client_max_body_size 20m;             # a full first sync can be a few MB

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;            # /analyze can take a minute
    }
}
